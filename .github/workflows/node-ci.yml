name: Node source checks
on:
  workflow_call:
    inputs:
      workspace_path:
        required: true
        type: string
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check workspace input
        env:
          WORKSPACE_PATH: ${{ inputs.workspace_path }}
        run: |
          case "$WORKSPACE_PATH" in
            services/agents|services/github-app|services/orchestrator|services/validator|services/local-runtime) ;;
            *) exit 1 ;;
          esac
      - name: Install locked dependencies without lifecycle scripts
        working-directory: ${{ inputs.workspace_path }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install local-runtime cross-package type dependencies
        if: inputs.workspace_path == 'services/local-runtime'
        run: |
          for service in agents github-app orchestrator validator; do
            npm ci --prefix "services/$service" --ignore-scripts --no-audit --no-fund
          done
      - name: Test
        working-directory: ${{ inputs.workspace_path }}
        run: npm test
      - name: Lint
        working-directory: ${{ inputs.workspace_path }}
        run: npm run lint
      - name: Type check
        working-directory: ${{ inputs.workspace_path }}
        run: npm run type-check
