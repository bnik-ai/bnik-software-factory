name: "Incident — production deviation"
description: "A software-factory production deviation requiring response. Opened by humans or an alerting integration."
title: "[Incident] "
labels:
  - "kind:incident"
body:
  - type: markdown
    attributes:
      value: |
        Incident is a deferred record kind: the validator runs no Incident lifecycle and nothing pages anyone automatically. Track the response in this issue.

        For incidents in an *application* the factory built (e.g. sample-app), open the Incident in that application's repo, not here.

        **Severity label is intentionally NOT auto-applied by this form.** The dropdown below records the selected severity; nothing reads it. The reporter or first responder applies the matching `severity:*` label by hand after creation, so no form-created incident silently carries a default severity.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: "high = factory cannot route work (orchestrator/validator down); medium = degraded but operating; low = internal issue, no human-visible impact"
      options:
        - "high"
        - "medium"
        - "low"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: One-line summary
      placeholder: "Validator dropping webhook events since 14:23 UTC — Service Bus session lock leak"
    validations:
      required: true

  - type: textarea
    id: detection
    attributes:
      label: How was this detected?
      placeholder: "Azure Monitor alert / user report / smoke check failure / audit-ledger gap"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: User-visible impact
      placeholder: "All Task transitions blocked; ~N Goals stalled; audit ledger has Y-second gap"
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline (append as you investigate)
      placeholder: |
        - 14:23 UTC: alert fired
        - 14:25 UTC: investigating
        - 14:30 UTC: identified cause (...)
        - 14:35 UTC: mitigation deployed (...)

  - type: input
    id: linked_deployment
    attributes:
      label: Linked Deployment (if regression)
      description: "GitHub Deployment ID or commit SHA that introduced the issue, if known."
