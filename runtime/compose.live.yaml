# GitHub intake only; the model key is never mounted in the control plane.
services:
  runtime:
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:?App ID required}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/app_private_key
      FACTORY_REPOSITORY_ID: ${FACTORY_REPOSITORY_ID:?Numeric repository ID required}
      FACTORY_WEBHOOK_URL: ${FACTORY_WEBHOOK_URL:?User-controlled HTTPS webhook URL required}
      FACTORY_OPERATORS: ${FACTORY_OPERATORS:?Explicit human operators required}
      FACTORY_EXECUTION: disabled
    secrets: [app_private_key]
secrets:
  app_private_key: {file: "${FACTORY_STATE_DIR:-.}/secrets/app_private_key"}
