# Mount individual files: never expose the whole private state directory.
x-config: &config
  type: bind
  source: ${FACTORY_STATE_DIR}/.env
  target: /state/.env
  read_only: true
  bind: {create_host_path: false}
x-database: &database
  type: bind
  source: ${FACTORY_STATE_DIR}/secrets/database_password
  target: /state/secrets/database_password
  read_only: true
  bind: {create_host_path: false}
x-webhook: &webhook
  type: bind
  source: ${FACTORY_STATE_DIR}/secrets/webhook_secret
  target: /state/secrets/webhook_secret
  read_only: true
  bind: {create_host_path: false}
x-app: &app
  type: bind
  source: ${FACTORY_STATE_DIR}/secrets/app_private_key
  target: /state/secrets/app_private_key
  read_only: true
  bind: {create_host_path: false}
x-model: &model
  type: bind
  source: ${FACTORY_STATE_DIR}/secrets/model_key
  target: /state/secrets/model_key
  read_only: true
  bind: {create_host_path: false}
x-controller: &controller
  type: bind
  source: ${FACTORY_STATE_DIR}/secrets/controller_database_password
  target: /state/secrets/controller_database_password
  read_only: true
  bind: {create_host_path: false}
x-publisher: &publisher
  type: bind
  source: ${FACTORY_STATE_DIR}/secrets/publisher_private_key
  target: /state/secrets/publisher_private_key
  read_only: true
  bind: {create_host_path: false}
# The merger App's key; only the automatic-merge supervisor (merge, merge-scan) sees it.
x-merger: &merger
  type: bind
  source: ${FACTORY_STATE_DIR}/secrets/merger_private_key
  target: /state/secrets/merger_private_key
  read_only: true
  bind: {create_host_path: false}
x-policy: &policy
  type: bind
  source: ${FACTORY_STATE_DIR}/autonomy-policy.json
  target: /state/autonomy-policy.json
  read_only: true
  bind: {create_host_path: false}
x-acceptance: &acceptance
  type: bind
  source: ${FACTORY_STATE_DIR}/acceptance
  target: /state/acceptance
  read_only: true
  bind: {create_host_path: false}
x-artifacts: &artifacts
  type: bind
  source: ${FACTORY_STATE_DIR}/artifacts
  target: /artifacts
  bind: {create_host_path: false}
x-socket: &socket
  type: bind
  source: ${FACTORY_DOCKER_SOCKET:-/var/run/docker.sock}
  target: /var/run/docker.sock
  bind: {create_host_path: false}
x-operator: &operator
  image: ${FACTORY_OPERATOR_IMAGE:?Use ./sfac}
  profiles: [operator]
  user: "${LOCAL_UID}:${LOCAL_GID}"
  environment:
    FACTORY_STATE_DIR: /state
    FACTORY_DATABASE_HOST: db
    FACTORY_RUNTIME_URL: http://runtime:8787
    FACTORY_WORKER_IMAGE: ${FACTORY_WORKER_IMAGE:?Use ./sfac}
    HOME: /tmp
  init: true
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 1
  pids_limit: 128
  logging: {driver: none}
x-supervisor: &supervisor
  <<: *operator
  group_add: ["${FACTORY_DOCKER_GID:-0}"]
  mem_limit: 1g
  memswap_limit: 1g
  pids_limit: 256
services:
  operator:
    <<: *operator
    network_mode: none
    volumes: [*artifacts]
  probe:
    <<: *operator
  database-operator:
    <<: *operator
    volumes: [*config, *database]
  demo-operator:
    <<: *operator
    volumes: [*config, *webhook]
  github-operator:
    <<: *operator
    volumes: [*config, *database, *webhook, *app, *artifacts]
  supervisor:
    <<: *supervisor
    volumes: [*config, *database, *socket]
  demo-supervisor:
    <<: *supervisor
    volumes: [*config, *database, *webhook, *artifacts, *socket]
  live-supervisor:
    <<: *supervisor
    volumes: [*config, *database, *webhook, *app, *model, *artifacts, *socket]
  # Controller identity only: policy activation, scopes, approvals, status.
  autonomy-operator:
    <<: *operator
    volumes: [*config, *controller, *webhook, *policy]
  # Demo autonomy: fixture adapters, no GitHub or model credentials.
  demo-autonomy-supervisor:
    <<: *supervisor
    volumes: [*config, *controller, *webhook, *policy, *acceptance, *artifacts, *socket]
  # Live autonomy: source reads through the App key, model key for the worker proxy and
  # reviewer, publisher App key for the Git Data API. The worker never sees any of them.
  live-autonomy-supervisor:
    <<: *supervisor
    volumes: [*config, *controller, *webhook, *app, *model, *publisher, *policy, *acceptance, *artifacts, *socket]
  # Automatic merge (merge, merge-scan): the same, plus the merger App key that exists only with --automerge.
  live-automerge-supervisor:
    <<: *supervisor
    volumes: [*config, *controller, *webhook, *app, *model, *publisher, *merger, *policy, *acceptance, *artifacts, *socket]
